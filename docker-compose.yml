version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cybewatch-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybewatch_secure_pwd_2026}
      POSTGRES_DB: ${POSTGRES_DB:-cybewatch_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybewatch}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cybewatch-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybewatch-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cybewatch}:${POSTGRES_PASSWORD:-cybewatch_secure_pwd_2026}@db:5432/${POSTGRES_DB:-cybewatch_db}
      - SECRET_KEY=${SECRET_KEY:-cybewatch-production-secret-key-replace-in-env}
      - ENVIRONMENT=production
      - DEBUG=False
      - LLM_PROVIDER=local_deterministic
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./datasets:/app/datasets

volumes:
  postgres_data:
  redis_data:
